openapi: 3.0.3
info:
  title: Bottin Profile Reach API
  description: >
    Read-only access to precomputed Nostr profile "reach" — the number of
    distinct users whose current NIP-02 contact list includes the target
    profile. Figures are produced by a scheduled background calculation and
    served from storage; this endpoint never computes on demand.
  version: 1.0.0

servers:
  - url: /api/v1

paths:
  /profiles/{identifier}/reach:
    get:
      operationId: getProfileReach
      summary: Get the stored reach for a profile
      description: >
        Returns the most recently calculated reach for the profile identified
        by `identifier`, regardless of the figure's age (no maximum-age
        threshold is enforced; FR-018). The response always carries the
        calculation timestamp and a `complete` flag indicating whether the
        figure was gathered from a full or partial set of relays (FR-019).
        Public endpoint; per-client rate limiting applies (FR-017).
      tags:
        - Profile Stats
      parameters:
        - name: identifier
          in: path
          required: true
          description: >
            The profile's `npub` (NIP-19 bech32) or its 64-character hex
            public key.
          schema:
            type: string
          examples:
            npub:
              value: npub1sg6plzptd64u62a878hep2kev88swjh3tw00gjsfl8f237lmu63q0uf63m
            hex:
              value: 82341f882b6eabcd2ba7f1ef90aad961cf074af15b9ef44a09f9d2a8fbfbe6a2
      responses:
        '200':
          description: Reach figure found and returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileReachResponse'
        '400':
          description: The identifier is malformed or not a supported format (FR-005).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            No reach figure is available for this profile — it has never been
            calculated or is not a tracked profile (FR-004). Distinct from a
            calculated reach of 0, which returns 200 with reachCount = 0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Per-client rate limit exceeded (FR-017).

components:
  schemas:
    ProfileReachResponse:
      type: object
      required: [pubkey, npub, reachCount, complete, calculatedAt]
      properties:
        pubkey:
          type: string
          description: Canonical 64-character hex public key.
          example: 82341f882b6eabcd2ba7f1ef90aad961cf074af15b9ef44a09f9d2a8fbfbe6a2
        npub:
          type: string
          description: NIP-19 bech32 encoding of the same key.
          example: npub1sg6plzptd64u62a878hep2kev88swjh3tw00gjsfl8f237lmu63q0uf63m
        reachCount:
          type: integer
          format: int64
          minimum: 0
          description: Distinct current followers (NIP-02). May be 0.
          example: 1542
        complete:
          type: boolean
          description: >
            true if every targeted relay responded when this figure was
            gathered; false if it was built from a partial set of relays and
            may undercount.
          example: true
        calculatedAt:
          type: string
          format: date-time
          description: When this figure was last calculated.
          example: '2026-06-25T06:00:12Z'

    ErrorResponse:
      type: object
      description: Matches the project-wide error contract (code, message, suggestion, path).
      properties:
        errorCode:
          type: string
          example: REACH_NOT_AVAILABLE
        message:
          type: string
          example: No reach figure is available for the requested profile.
        suggestion:
          type: string
          example: This profile may not be registered or has not yet been calculated. Try again after the next scheduled run.
        path:
          type: string
          example: /api/v1/profiles/npub1.../reach
