spring:
  application:
    name: bottin-it

  # bottin-api's SecurityConfig publishes an "any request" filter chain, which
  # actuator's management chain then collides with. The integration tests here
  # exercise repositories and services, not the actuator surface, so the
  # management chain is excluded rather than reordering production security.
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

  # JPA Configuration for tests
  #
  # The schema comes from Flyway, not from Hibernate. These tests run against
  # PostgreSQL, and Hibernate's generated DDL is not valid there — it emits
  # `role enum ('ADMIN','READONLY')` for AdminUserEntity, which PostgreSQL
  # rejects with `type "enum" does not exist`, aborting schema creation and
  # leaving every later table missing. The migrations are hand-written and
  # PostgreSQL-correct, and they are what production actually runs, which is
  # what an integration test should be exercising.
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

  # Security - test credentials
  security:
    user:
      name: admin
      password: test-password

# Bottin Configuration
bottin:
  enabled: true
  default-domain: test.example.com

  admin:
    username: admin
    password: test-password

  verification:
    dns-timeout-seconds: 2
    http-timeout-seconds: 5

    external:
      timeout-seconds: 5
      require-https: false
      max-response-size: 102400

    cache:
      ttl-minutes: 1
      max-size: 100

  ratelimit:
    cleanup-threshold: 100

# Logging - reduce noise in tests
logging:
  level:
    root: WARN
    xyz.tcheeric.bottin: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.testcontainers: INFO
