spring:
  application:
    name: bottin-e2e

  # Allow bean definition overriding for test context
  main:
    allow-bean-definition-overriding: true

  # JPA Configuration for E2E tests
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        # Suppress PostgreSQL createClob() warning
        jdbc:
          lob:
            non_contextual_creation: true

  # DataSource/HikariCP configuration for Testcontainers
  datasource:
    hikari:
      # Shorter max-lifetime to avoid stale connection warnings on shutdown
      max-lifetime: 60000
      # Faster shutdown
      connection-timeout: 5000
      validation-timeout: 3000
      # Smaller pool for tests
      maximum-pool-size: 5

  # Flyway - disabled for E2E tests
  flyway:
    enabled: false

  # Security
  security:
    user:
      name: admin
      password: e2e-test-password

# Bottin Configuration
bottin:
  enabled: true
  default-domain: e2e.example.com

  admin:
    username: admin
    password: e2e-test-password

  verification:
    dns-timeout-seconds: 2
    http-timeout-seconds: 5

    external:
      timeout-seconds: 5
      require-https: false
      max-response-size: 102400

    cache:
      ttl-minutes: 1
      max-size: 100

  ratelimit:
    cleanup-threshold: 100

# Logging
logging:
  level:
    root: WARN
    xyz.tcheeric.bottin: INFO
    org.springframework.security: WARN
    org.testcontainers: INFO
