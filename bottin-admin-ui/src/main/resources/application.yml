spring:
  application:
    name: bottin-admin

  # Database - use H2 by default for development
  datasource:
    url: jdbc:h2:mem:bottin;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

  # H2 Console (development only)
  h2:
    console:
      enabled: true
      path: /h2-console

  # Thymeleaf
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

# Server configuration - admin runs on port 8081 by default
# NAP's rate limiter and its outstanding-challenge caps key on the caller's
# address, so what the container believes that address to be decides whether
# they bound one caller or every caller at once.
#
# Tomcat's RemoteIpValve applies X-Forwarded-For, but only when the immediate
# peer matches internal-proxies. That list is empty here, so by default nothing
# is trusted to state the caller's address and a direct caller cannot mint a
# fresh identity per request to walk past the limiter.
#
# Tomcat's own default trusts every private range, which is not safe for this
# deployment: with the port published from Docker the peer is the bridge
# gateway, a private address, so any caller reaching the port would be trusted.
#
# Behind a real proxy, set BOTTIN_TRUSTED_PROXIES to a regex matching it (e.g.
# "10\.0\.0\.5" or "172\.18\.\d{1,3}\.\d{1,3}"). Until you do, every
# administrator shares one bucket keyed on the proxy's address — 30 sign-in
# attempts a minute between them, and 30 outstanding challenges in total.
server:
  port: 8081
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${BOTTIN_TRUSTED_PROXIES:}

# NAP: administrators sign in by proving control of a Nostr key.
#
# The cookie name must differ from the client's `client_session`. Cookies are
# not isolated by port, so on localhost a shared name would let one
# application's session silently overwrite the other's.
nap:
  enabled: true
  external-base-url: ${BOTTIN_ADMIN_EXTERNAL_URL:http://localhost:8081}
  challenge-ttl-seconds: 60
  session-ttl-seconds: 3600
  max-clock-skew-seconds: 60
  protected-path-prefixes: /admin
  cookie:
    name: admin_session
    http-only: true
    secure: ${COOKIE_SECURE:true}
    same-site: Lax
    path: /
    max-age-seconds: 3600

# Bottin Configuration
bottin:
  default-domain: ""

  admin:
    # The public key of the administrator, as npub or hex. Not a secret — a
    # public key is safe to publish, which is what makes it safe to configure
    # here where a password was not. Deliberately has no default: an
    # unconfigured deployment must admit nobody rather than somebody known.
    npub: ${BOTTIN_ADMIN_NPUB:}

# Logging
logging:
  level:
    xyz.tcheeric.bottin: DEBUG
    org.springframework.security: INFO
