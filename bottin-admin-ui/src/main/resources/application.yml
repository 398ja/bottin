spring:
  application:
    name: bottin-admin

  # Database - use H2 by default for development
  datasource:
    url: jdbc:h2:mem:bottin;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

  # H2 Console (development only)
  h2:
    console:
      enabled: true
      path: /h2-console

  # Thymeleaf
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

# Server configuration - admin runs on port 8081 by default
server:
  port: 8081

# Bottin Configuration
bottin:
  default-domain: ""

  # Admin credentials
  admin:
    username: admin
    # password: Set via BOTTIN_ADMIN_PASSWORD environment variable

# Logging
logging:
  level:
    xyz.tcheeric.bottin: DEBUG
    org.springframework.security: INFO
