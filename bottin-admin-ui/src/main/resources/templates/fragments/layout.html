<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Bottin Admin'">Bottin Admin</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
    <!-- Key handling and the NAP handshake, shared with the client. Loaded on
         every admin page because signing out needs them wherever the
         administrator happens to be. -->
    <script src="/js/nostr-tools.js"></script>
    <script src="/js/nostr-crypto.js"></script>
    <script src="/js/nap-client.js"></script>
    <script src="/js/admin-signin.js"></script>
</head>

<nav th:fragment="navigation" class="bg-gray-800">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
            <div class="flex items-center">
                <div class="flex-shrink-0">
                    <span class="text-white text-xl font-bold">Bottin</span>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                        <a href="/admin/dashboard"
                           class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white">Dashboard</a>
                        <a href="/admin/records"
                           class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white">Records</a>
                        <a href="/admin/domains"
                           class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white">Domains</a>
                        <a href="/admin/settings"
                           class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white">Settings</a>
                    </div>
                </div>
            </div>
            <div class="hidden md:block">
                <div class="ml-4 flex items-center md:ml-6">
                    <span class="text-gray-300 text-sm mr-4" sec:authentication="name">User</span>
                    <!-- Signing out ends the session and erases the key stored in
                         this browser. Prominent rather than tucked away: because
                         the key rests here until sign-out, an administrator who
                         walks away without using this leaves it behind. -->
                    <button type="button" id="admin-signout-btn"
                            class="rounded-md bg-gray-700 px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-600 hover:text-white">
                        Sign out
                    </button>
                </div>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="alerts" class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 mt-4">
    <div th:if="${success}" class="rounded-md bg-green-50 p-4 mb-4">
        <div class="flex">
            <div class="flex-shrink-0">
                <svg class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
                </svg>
            </div>
            <div class="ml-3">
                <p class="text-sm font-medium text-green-800" th:text="${success}">Success message</p>
            </div>
        </div>
    </div>

    <div th:if="${error}" class="rounded-md bg-red-50 p-4 mb-4">
        <div class="flex">
            <div class="flex-shrink-0">
                <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" />
                </svg>
            </div>
            <div class="ml-3">
                <p class="text-sm font-medium text-red-800" th:text="${error}">Error message</p>
            </div>
        </div>
    </div>

    <div th:if="${info}" class="rounded-md bg-blue-50 p-4 mb-4">
        <div class="flex">
            <div class="flex-shrink-0">
                <svg class="h-5 w-5 text-blue-400" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a.75.75 0 000 1.5h.253a.25.25 0 01.244.304l-.459 2.066A1.75 1.75 0 0010.747 15H11a.75.75 0 000-1.5h-.253a.25.25 0 01-.244-.304l.459-2.066A1.75 1.75 0 009.253 9H9z" clip-rule="evenodd" />
                </svg>
            </div>
            <div class="ml-3">
                <p class="text-sm font-medium text-blue-800" th:text="${info}">Info message</p>
            </div>
        </div>
    </div>
</div>

<footer th:fragment="footer" class="bg-gray-100 mt-auto">
    <div class="mx-auto max-w-7xl px-4 py-4 sm:px-6 lg:px-8">
        <p class="text-center text-sm text-gray-500">Bottin NIP-05 Registry</p>
    </div>
    <script>
        (function () {
            var button = document.getElementById('admin-signout-btn');
            if (!button) return;

            button.addEventListener('click', function () {
                button.disabled = true;
                // The sign-in page is reached either way: the key is erased
                // whether or not the server acknowledged, so staying on an admin
                // page would only show one that no longer works.
                AdminSignIn.signOut()
                    .catch(function () { /* erased locally regardless */ })
                    .then(function () { window.location.href = '/admin/login'; });
            });
        })();
    </script>
</footer>
</html>
