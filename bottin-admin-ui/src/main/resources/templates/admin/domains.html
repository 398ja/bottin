<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Domains')}"></head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <nav th:replace="~{fragments/layout :: navigation}"></nav>

    <main class="flex-grow">
        <div class="mx-auto max-w-7xl py-6 sm:px-6 lg:px-8">
            <div class="px-4 py-6 sm:px-0">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-semibold text-gray-900">Domains</h1>
                    <button type="button" onclick="document.getElementById('createModal').classList.remove('hidden')"
                            class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700">
                        Add Domain
                    </button>
                </div>

                <div th:replace="~{fragments/layout :: alerts}"></div>

                <!-- Search -->
                <div class="mb-6">
                    <form method="get" class="flex gap-4">
                        <div class="flex-1">
                            <input type="text" name="search" th:value="${search}"
                                   placeholder="Search by domain name..."
                                   class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                        </div>
                        <button type="submit"
                                class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                            Search
                        </button>
                        <a th:if="${search}" href="/admin/domains"
                           class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                            Clear
                        </a>
                    </form>
                </div>

                <!-- Domains Table -->
                <div class="bg-white shadow rounded-lg overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Domain</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Records</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <tr th:each="domain : ${domains.content}">
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <a th:href="@{/admin/domains/{id}(id=${domain.id})}"
                                       class="text-indigo-600 hover:text-indigo-900 font-medium"
                                       th:text="${domain.name}">example.com</a>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span th:if="${domain.verified}"
                                          class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                                        Verified
                                    </span>
                                    <span th:unless="${domain.verified}"
                                          class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">
                                        Pending
                                    </span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"
                                    th:text="${domain.recordCount}">0</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"
                                    th:text="${#temporals.format(domain.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01</td>
                                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                    <a th:href="@{/admin/domains/{id}(id=${domain.id})}"
                                       class="text-indigo-600 hover:text-indigo-900 mr-3">View</a>
                                    <form th:action="@{/admin/domains/{id}/delete(id=${domain.id})}" method="post" class="inline"
                                          onsubmit="return confirm('Are you sure you want to delete this domain? All associated records will also be deleted.');">
                                        <button type="submit" class="text-red-600 hover:text-red-900">Delete</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${domains.content.isEmpty()}">
                                <td colspan="5" class="px-6 py-4 text-center text-gray-500">No domains found</td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- Pagination -->
                    <div th:if="${domains.totalPages > 1}" class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6">
                        <div class="flex-1 flex justify-between sm:hidden">
                            <a th:href="@{/admin/domains(page=${domains.number - 1}, search=${search})}"
                               th:classappend="${domains.first} ? 'pointer-events-none opacity-50' : ''"
                               class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                                Previous
                            </a>
                            <a th:href="@{/admin/domains(page=${domains.number + 1}, search=${search})}"
                               th:classappend="${domains.last} ? 'pointer-events-none opacity-50' : ''"
                               class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                                Next
                            </a>
                        </div>
                        <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                            <div>
                                <p class="text-sm text-gray-700">
                                    Showing <span class="font-medium" th:text="${domains.number * domains.size + 1}">1</span>
                                    to <span class="font-medium" th:text="${domains.number * domains.size + domains.numberOfElements}">10</span>
                                    of <span class="font-medium" th:text="${domains.totalElements}">100</span> results
                                </p>
                            </div>
                            <div>
                                <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px">
                                    <a th:href="@{/admin/domains(page=${domains.number - 1}, search=${search})}"
                                       th:classappend="${domains.first} ? 'pointer-events-none opacity-50' : ''"
                                       class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                        Previous
                                    </a>
                                    <a th:href="@{/admin/domains(page=${domains.number + 1}, search=${search})}"
                                       th:classappend="${domains.last} ? 'pointer-events-none opacity-50' : ''"
                                       class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                        Next
                                    </a>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Create Modal -->
    <div id="createModal" class="hidden fixed inset-0 bg-gray-500 bg-opacity-75 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
            <div class="px-4 py-5 sm:p-6">
                <h3 class="text-lg font-medium leading-6 text-gray-900 mb-4">Add New Domain</h3>
                <form th:action="@{/admin/domains}" method="post" th:object="${createForm}">
                    <div class="space-y-4">
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700">Domain Name</label>
                            <input type="text" name="name" id="name" required
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                                   placeholder="example.com">
                        </div>
                        <div>
                            <label for="ownerPubkey" class="block text-sm font-medium text-gray-700">Owner Public Key (optional)</label>
                            <input type="text" name="ownerPubkey" id="ownerPubkey"
                                   pattern="[0-9a-f]{64}"
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm font-mono"
                                   placeholder="79be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798">
                            <p class="mt-1 text-xs text-gray-500">64 hex characters, leave empty if no owner</p>
                        </div>
                    </div>
                    <div class="mt-5 sm:mt-6 sm:grid sm:grid-cols-2 sm:gap-3">
                        <button type="button" onclick="document.getElementById('createModal').classList.add('hidden')"
                                class="w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 sm:text-sm">
                            Cancel
                        </button>
                        <button type="submit"
                                class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 sm:text-sm">
                            Create
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
