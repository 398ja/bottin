spring:
  application:
    name: bottin-admin

  # PostgreSQL Database for production
  datasource:
    url: ${BOTTIN_DATABASE_URL:jdbc:postgresql://localhost:5432/bottin}
    driver-class-name: org.postgresql.Driver
    username: ${BOTTIN_DATABASE_USER:bottin}
    password: ${BOTTIN_DATABASE_PASSWORD:}

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Disable H2 console in production
  h2:
    console:
      enabled: false

  # Thymeleaf - enable caching in production
  thymeleaf:
    cache: true
    prefix: classpath:/templates/
    suffix: .html

# Server configuration
server:
  port: ${BOTTIN_ADMIN_PORT:8081}
  tomcat:
    threads:
      max: 100
    max-connections: 5000

# Bottin Configuration
bottin:
  default-domain: ${BOTTIN_DEFAULT_DOMAIN:}

  # Admin credentials
  admin:
    username: ${BOTTIN_ADMIN_USER:admin}
    # password set via BOTTIN_ADMIN_PASSWORD environment variable

# Logging
logging:
  level:
    root: INFO
    xyz.tcheeric.bottin: INFO
    org.springframework.security: WARN
