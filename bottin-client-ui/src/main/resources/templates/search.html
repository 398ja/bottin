<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bottin - Search</title>
</head>
<body>
    <div th:fragment="content" class="container">
        <div th:replace="~{fragments/page-header :: header('Search Profiles', 'Find people on Nostr by name or NIP-05')}"></div>
        <div class="card">
            <div class="form-group">
                <input type="text" id="search-input" class="form-input" placeholder="Search by name or display name..."
                       autofocus autocomplete="off">
            </div>

            <div id="search-results">
                <div class="empty-state">
                    <div class="empty-state-icon">🔍</div>
                    <p>Search for Nostr profiles</p>
                </div>
            </div>

            <div id="search-loading" style="display: none;">
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text" style="width: 40%;"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var input = document.getElementById('search-input');
            var results = document.getElementById('search-results');
            var loading = document.getElementById('search-loading');

            var debouncedSearch = APP.debounce(function(query) {
                if (!query || !query.trim()) {
                    results.innerHTML = '';
                    var empty = document.createElement('div');
                    empty.className = 'empty-state';
                    empty.innerHTML = '<div class="empty-state-icon">🔍</div><p>Search for Nostr profiles</p>';
                    results.appendChild(empty);
                    return;
                }

                loading.style.display = 'block';

                fetch('/api/v1/search?q=' + encodeURIComponent(query.trim()) + '&limit=20')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        loading.style.display = 'none';
                        results.innerHTML = '';
                        if (data.results && data.results.length > 0) {
                            data.results.forEach(function(r) {
                                var div = document.createElement('div');
                                div.className = 'search-result';

                                var img = document.createElement('img');
                                img.src = r.picture || '/img/default-avatar.svg';
                                img.alt = '';
                                img.className = 'avatar-sm';
                                img.onerror = function() { this.src = '/img/default-avatar.svg'; };
                                div.appendChild(img);

                                var info = document.createElement('div');
                                info.className = 'search-result-info';

                                var name = document.createElement('div');
                                name.className = 'search-result-name';
                                name.textContent = r.displayName || r.name || 'Unknown';
                                info.appendChild(name);

                                var detail = document.createElement('div');
                                detail.className = 'search-result-detail';
                                detail.textContent = '@' + (r.name || '') + ' \u00B7 ' + (r.nip05 || 'no NIP-05');
                                info.appendChild(detail);

                                div.appendChild(info);

                                if (r.blocked) {
                                    var badge = document.createElement('span');
                                    badge.className = 'badge badge-danger';
                                    badge.textContent = 'Blocked';
                                    div.appendChild(badge);
                                } else if (r.followed) {
                                    var btn = document.createElement('button');
                                    btn.className = 'btn btn-sm btn-outline';
                                    btn.textContent = 'Unfollow';
                                    btn.dataset.pubkey = r.pubkey;
                                    btn.addEventListener('click', function() { unfollow(this.dataset.pubkey); });
                                    div.appendChild(btn);
                                } else {
                                    var btn = document.createElement('button');
                                    btn.className = 'btn btn-sm btn-primary';
                                    btn.textContent = 'Follow';
                                    btn.dataset.pubkey = r.pubkey;
                                    btn.addEventListener('click', function() { follow(this.dataset.pubkey); });
                                    div.appendChild(btn);
                                }

                                results.appendChild(div);
                            });
                        } else {
                            var empty = document.createElement('div');
                            empty.className = 'empty-state';
                            empty.innerHTML = '<div class="empty-state-icon">📭</div><p>No profiles found</p>';
                            results.appendChild(empty);
                        }
                    })
                    .catch(function() {
                        loading.style.display = 'none';
                        results.innerHTML = '';
                        var empty = document.createElement('div');
                        empty.className = 'empty-state';
                        empty.innerHTML = '<div class="empty-state-icon">⚠️</div><p>Search failed. Try again.</p>';
                        results.appendChild(empty);
                    });
            }, 300);

            input.addEventListener('input', function() {
                debouncedSearch(this.value);
            });
        })();

        function follow(pubkey) {
            fetch('/api/v1/follow', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pubkey: pubkey })
            }).then(function(r) {
                if (r.ok) APP.showToast('Followed', 'success');
                else APP.showToast('Failed to follow', 'error');
            });
        }

        function unfollow(pubkey) {
            fetch('/api/v1/unfollow', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pubkey: pubkey })
            }).then(function(r) {
                if (r.ok) APP.showToast('Unfollowed', 'success');
                else APP.showToast('Failed to unfollow', 'error');
            });
        }
    </script>
</body>
</html>
