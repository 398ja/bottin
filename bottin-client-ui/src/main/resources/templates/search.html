<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bottin - Search</title>
</head>
<body>
    <div th:fragment="content" class="container">
        <div th:replace="~{fragments/page-header :: header('Search Profiles', 'Find the handles registered in this directory')}"></div>
        <div class="card">
            <div class="form-group">
                <input type="text" id="search-input" class="form-input" placeholder="Search by handle..."
                       autofocus autocomplete="off">
            </div>

            <div id="search-results">
                <div class="empty-state">
                    <div class="empty-state-icon">🔍</div>
                    <p>Search for a registered handle</p>
                </div>
            </div>

            <div id="search-loading" style="display: none;">
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text" style="width: 40%;"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var input = document.getElementById('search-input');
            var results = document.getElementById('search-results');
            var loading = document.getElementById('search-loading');

            var debouncedSearch = APP.debounce(function(query) {
                if (!query || !query.trim()) {
                    results.innerHTML = '';
                    var empty = document.createElement('div');
                    empty.className = 'empty-state';
                    empty.innerHTML = '<div class="empty-state-icon">🔍</div><p>Search for a registered handle</p>';
                    results.appendChild(empty);
                    return;
                }

                loading.style.display = 'block';

                fetch('/api/v1/search?q=' + encodeURIComponent(query.trim()) + '&limit=20')
                    .then(function(r) {
                        // An unreachable directory answers 502. Parsing that body
                        // would leave data.results undefined and render the empty
                        // state, telling the searcher nobody matched when in fact
                        // nothing was searched.
                        if (!r.ok) throw new Error('search_failed');
                        return r.json();
                    })
                    .then(function(data) {
                        loading.style.display = 'none';
                        results.innerHTML = '';
                        if (data.results && data.results.length > 0) {
                            data.results.forEach(function(r) {
                                // The whole row opens the profile. The directory
                                // knows the handle and the key, nothing else, so
                                // the published profile is where the rest lives.
                                var row = document.createElement('a');
                                row.className = 'search-result';
                                row.href = '/profile/' + encodeURIComponent(r.pubkey);

                                var img = document.createElement('img');
                                img.src = '/img/default-avatar.svg';
                                img.alt = '';
                                img.className = 'avatar-sm';
                                row.appendChild(img);

                                var info = document.createElement('div');
                                info.className = 'search-result-info';

                                var name = document.createElement('div');
                                name.className = 'search-result-name';
                                name.textContent = r.name;
                                info.appendChild(name);

                                // The full identifier, not just the local part: the
                                // domain is what a reader has to look at to tell
                                // alice@example.com from a lookalike.
                                var detail = document.createElement('div');
                                detail.className = 'search-result-detail';
                                detail.textContent = r.nip05;
                                info.appendChild(detail);

                                row.appendChild(info);
                                results.appendChild(row);
                            });
                        } else {
                            var empty = document.createElement('div');
                            empty.className = 'empty-state';
                            empty.innerHTML = '<div class="empty-state-icon">📭</div><p>No profiles found</p>';
                            results.appendChild(empty);
                        }
                    })
                    .catch(function() {
                        loading.style.display = 'none';
                        results.innerHTML = '';
                        var empty = document.createElement('div');
                        empty.className = 'empty-state';
                        empty.innerHTML = '<div class="empty-state-icon">⚠️</div><p>Search failed. Try again.</p>';
                        results.appendChild(empty);
                    });
            }, 300);

            input.addEventListener('input', function() {
                debouncedSearch(this.value);
            });
        })();
    </script>
</body>
</html>
