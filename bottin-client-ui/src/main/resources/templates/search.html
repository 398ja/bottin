<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bottin - Search</title>
</head>
<body>
    <div th:fragment="content" class="container">
        <div th:replace="~{fragments/page-header :: header('Search Profiles', 'Find the handles registered in this directory')}"></div>
        <div class="card">
            <div class="form-group">
                <input type="text" id="search-input" class="form-input" placeholder="Search by handle..."
                       autofocus autocomplete="off">
            </div>

            <div id="search-results">
                <div class="empty-state">
                    <div class="empty-state-icon">🔍</div>
                    <p>Search for a registered handle</p>
                </div>
            </div>

            <div id="search-loading" style="display: none;">
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text" style="width: 40%;"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var input = document.getElementById('search-input');
            var results = document.getElementById('search-results');
            var loading = document.getElementById('search-loading');

            var reportOutcome = ListFeedback.reportOutcome;
            var reportRefusal = ListFeedback.reportRefusal;

            function buildRow(r) {
                var row = document.createElement('div');
                row.className = 'search-result';

                // Only the navigating part is a link; the controls sit beside it.
                var link = document.createElement('a');
                link.className = 'search-result-link';
                link.href = '/profile/' + encodeURIComponent(r.pubkey);

                // The placeholder stands in until the relays answer; a picture URL
                // that will not load falls back to it rather than leaving a broken
                // image beside the handle.
                var img = document.createElement('img');
                img.src = ProfileLookup.DEFAULT_AVATAR;
                img.alt = '';
                img.className = 'avatar-sm';
                img.onerror = function() { this.src = ProfileLookup.DEFAULT_AVATAR; };
                link.appendChild(img);

                var info = document.createElement('div');
                info.className = 'search-result-info';

                var name = document.createElement('div');
                name.className = 'search-result-name';
                name.textContent = r.name;
                info.appendChild(name);

                // The full identifier, not just the local part: the domain is what a
                // reader has to look at to tell alice@example.com from a lookalike.
                var detail = document.createElement('div');
                detail.className = 'search-result-detail';
                detail.textContent = r.nip05;
                info.appendChild(detail);

                link.appendChild(info);
                row.appendChild(link);

                var userId = APP.getIdentityUserId();
                if (userId) {
                    row.appendChild(buildFollowButton(userId, r.pubkey));
                    row.appendChild(buildBlockButton(userId, r.pubkey, row));
                }

                return row;
            }

            function blockedKeys() {
                var userId = APP.getIdentityUserId();
                return userId ? BlockList.cached(userId) : [];
            }

            // Blocking removes the row there and then, without re-running the search:
            // the point of blocking someone is not to see them.
            function buildBlockButton(userId, pubkey, row) {
                var button = document.createElement('button');
                button.className = 'btn btn-sm btn-outline';
                button.textContent = 'Block';

                button.addEventListener('click', function() {
                    button.disabled = true;
                    BlockList.block(userId, pubkey)
                        .then(function(result) {
                            reportOutcome(result, 'Blocked');
                            if (result.published > 0 || result.unchanged) row.remove();
                        })
                        .catch(function(err) { reportRefusal(err, 'block', 'blocking'); })
                        .then(function() { button.disabled = false; });
                });

                return button;
            }

            // Labelled from the cache so a keystroke costs no relay round-trip. The
            // cache may be stale, which can mislabel this button but can never
            // influence what gets published - every mutation re-reads first.
            function buildFollowButton(userId, pubkey) {
                var button = document.createElement('button');
                var following = FollowList.cached(userId).indexOf(pubkey) !== -1;

                function paint() {
                    button.textContent = following ? 'Following' : 'Follow';
                    button.className = 'btn btn-sm ' + (following ? 'btn-outline' : 'btn-primary');
                }
                paint();

                button.addEventListener('click', function() {
                    button.disabled = true;
                    var action = following ? FollowList.unfollow : FollowList.follow;
                    var doneLabel = following ? 'Unfollowed' : 'Following';
                    action(userId, pubkey)
                        .then(function(result) {
                            if (result.published > 0 || result.unchanged) following = !following;
                            reportOutcome(result, doneLabel);
                        })
                        .catch(function(err) { reportRefusal(err, 'follow', 'following'); })
                        .then(function() { button.disabled = false; paint(); });
                });

                return button;
            }

            // The directory knows a handle and a key, never a picture: that lives in
            // the owner's kind-0 on the relays. Rows are therefore rendered at once
            // with the placeholder and painted when the relays answer, so a slow or
            // unreachable relay costs the searcher nothing but the faces.
            //
            // Needs no guard against a superseded search: every render rebuilds its
            // rows, so a late answer holds only the images its own search created,
            // long since detached. Look these up from the live DOM instead and that
            // stops being true.
            function paintAvatars(avatars) {
                var pubkeys = Object.keys(avatars);
                ProfileLookup.resolve(APP.getIdentityUserId(), pubkeys)
                    .then(function(profiles) {
                        pubkeys.forEach(function(pubkey) {
                            var profile = profiles[pubkey];
                            if (profile && profile.picture) avatars[pubkey].src = profile.picture;
                        });
                    });
            }

            var debouncedSearch = APP.debounce(function(query) {
                if (!query || !query.trim()) {
                    results.innerHTML = '';
                    var empty = document.createElement('div');
                    empty.className = 'empty-state';
                    empty.innerHTML = '<div class="empty-state-icon">🔍</div><p>Search for a registered handle</p>';
                    results.appendChild(empty);
                    return;
                }

                loading.style.display = 'block';

                fetch('/api/v1/search?q=' + encodeURIComponent(query.trim()) + '&limit=20')
                    .then(function(r) {
                        // An unreachable directory answers 502. Parsing that body
                        // would leave data.results undefined and render the empty
                        // state, telling the searcher nobody matched when in fact
                        // nothing was searched.
                        if (!r.ok) throw new Error('search_failed');
                        return r.json();
                    })
                    .then(function(data) {
                        loading.style.display = 'none';
                        results.innerHTML = '';
                        // Blocked keys never reach the page. Filtered here rather than
                        // by the directory, which knows nothing of who blocked whom.
                        // Read once per search, not once per row: this parses the
                        // stored list, and a keystroke renders up to twenty rows.
                        var blocked = blockedKeys();
                        var visible = (data.results || []).filter(function(r) {
                            return blocked.indexOf(r.pubkey) === -1;
                        });
                        if (visible.length > 0) {
                            var avatars = {};
                            visible.forEach(function(r) {
                                var row = buildRow(r);
                                avatars[r.pubkey] = row.querySelector('img');
                                results.appendChild(row);
                            });
                            paintAvatars(avatars);
                        } else {
                            var empty = document.createElement('div');
                            empty.className = 'empty-state';
                            empty.innerHTML = '<div class="empty-state-icon">📭</div><p>No profiles found</p>';
                            results.appendChild(empty);
                        }
                    })
                    .catch(function() {
                        loading.style.display = 'none';
                        results.innerHTML = '';
                        var empty = document.createElement('div');
                        empty.className = 'empty-state';
                        empty.innerHTML = '<div class="empty-state-icon">⚠️</div><p>Search failed. Try again.</p>';
                        results.appendChild(empty);
                    });
            }, 300);

            input.addEventListener('input', function() {
                debouncedSearch(this.value);
            });
        })();
    </script>
</body>
</html>
