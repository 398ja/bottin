<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bottin - Search</title>
</head>
<body>
    <div th:fragment="content" class="container">
        <div class="card">
            <h1 style="font-size: 1.25rem; margin-bottom: 1rem;">Search Profiles</h1>

            <div class="form-group">
                <input type="text" id="search-input" class="form-input" placeholder="Search by name or display name..."
                       autofocus autocomplete="off">
            </div>

            <div id="search-results">
                <div class="empty-state">
                    <div class="empty-state-icon">🔍</div>
                    <p>Search for Nostr profiles</p>
                </div>
            </div>

            <div id="search-loading" style="display: none;">
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text" style="width: 40%;"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var input = document.getElementById('search-input');
            var results = document.getElementById('search-results');
            var loading = document.getElementById('search-loading');

            var debouncedSearch = APP.debounce(function(query) {
                if (!query || !query.trim()) {
                    results.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><p>Search for Nostr profiles</p></div>';
                    return;
                }

                loading.style.display = 'block';

                fetch('/api/v1/search?q=' + encodeURIComponent(query.trim()) + '&limit=20')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        loading.style.display = 'none';
                        if (data.results && data.results.length > 0) {
                            var html = '';
                            data.results.forEach(function(r) {
                                html += '<div class="search-result">';
                                html += '<img src="' + (r.picture || '/img/default-avatar.svg') + '" alt="" class="avatar-sm" onerror="this.src=\'/img/default-avatar.svg\'">';
                                html += '<div class="search-result-info">';
                                html += '<div class="search-result-name">' + (r.display_name || r.name || 'Unknown') + '</div>';
                                html += '<div class="search-result-detail">@' + (r.name || '') + ' &middot; ' + (r.nip05 || 'no NIP-05') + '</div>';
                                html += '</div>';
                                if (r.is_blocked) {
                                    html += '<span class="badge badge-danger">Blocked</span>';
                                } else if (r.is_followed) {
                                    html += '<button class="btn btn-sm btn-outline" onclick="unfollow(\'' + r.pubkey + '\')">Unfollow</button>';
                                } else {
                                    html += '<button class="btn btn-sm btn-primary" onclick="follow(\'' + r.pubkey + '\')">Follow</button>';
                                }
                                html += '</div>';
                            });
                            results.innerHTML = html;
                        } else {
                            results.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>No profiles found</p></div>';
                        }
                    })
                    .catch(function() {
                        loading.style.display = 'none';
                        results.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>Search failed. Try again.</p></div>';
                    });
            }, 300);

            input.addEventListener('input', function() {
                debouncedSearch(this.value);
            });
        })();

        function follow(pubkey) {
            fetch('/api/v1/follow', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pubkey: pubkey })
            }).then(function(r) {
                if (r.ok) APP.showToast('Followed', 'success');
                else APP.showToast('Failed to follow', 'error');
            });
        }

        function unfollow(pubkey) {
            fetch('/api/v1/unfollow', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pubkey: pubkey })
            }).then(function(r) {
                if (r.ok) APP.showToast('Unfollowed', 'success');
                else APP.showToast('Failed to unfollow', 'error');
            });
        }
    </script>
</body>
</html>
