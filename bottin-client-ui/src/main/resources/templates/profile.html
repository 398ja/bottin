<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bottin - Profile</title>
</head>
<body>
    <div th:fragment="content" class="container-narrow">
        <div class="card text-center">
            <img src="/img/default-avatar.svg" alt="" class="avatar-lg mb-2">

            <h1 style="font-size: 1.25rem;" id="display-name">Loading...</h1>
            <div class="text-secondary text-sm mb-1" id="username">@...</div>
            <div class="text-xs text-secondary mb-2" id="nip05"></div>
            <p class="text-sm mb-2" id="about"></p>

            <div class="flex-center gap-lg text-xs text-secondary mb-2">
                <span id="lightning"></span>
                <span id="website"></span>
            </div>

            <div class="flex-center gap-sm">
                <button class="btn btn-sm btn-outline" id="npub-copy-btn">Copy npub</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var npubCopyBtn = document.getElementById('npub-copy-btn');
            npubCopyBtn.addEventListener('click', function() {
                var npub = this.getAttribute('data-npub') || '';
                if (npub) {
                    navigator.clipboard.writeText(npub);
                    this.textContent = 'Copied!';
                    setTimeout(function() { npubCopyBtn.textContent = 'Copy npub'; }, 2000);
                }
            });
        })();
    </script>
</body>
</html>
