<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bottin - Profile</title>
</head>
<body>
    <div th:fragment="content" class="container-narrow">
        <div th:replace="~{fragments/page-header :: header('Profile', 'Your public Nostr identity')}"></div>
        <div class="card">
            <img src="" alt="" class="profile-banner hidden" id="profile-banner-image">
            <div class="text-center">
                <img src="/img/default-avatar.svg" alt="" class="avatar-lg mb-2" id="profile-avatar">
                <div style="font-size:1.25rem;font-weight:600;" id="profile-name">Your profile</div>
                <div class="text-xs text-secondary form-input-mono" id="profile-nip05"></div>
                <p class="mt-2 text-pretty hidden" id="profile-about"></p>
            </div>

            <dl class="profile-details">
                <div class="profile-detail hidden" id="profile-website-row">
                    <dt class="eyebrow">Website</dt>
                    <dd><a href="#" id="profile-website" rel="noopener noreferrer"></a></dd>
                </div>
                <div class="profile-detail hidden" id="profile-lud16-row">
                    <dt class="eyebrow">Lightning</dt>
                    <dd id="profile-lud16"></dd>
                </div>
            </dl>

            <a href="/profile/edit" class="btn btn-outline btn-full mt-3">Edit profile</a>
        </div>
    </div>

    <script src="/js/profile-view.js" defer></script>
</body>
</html>
