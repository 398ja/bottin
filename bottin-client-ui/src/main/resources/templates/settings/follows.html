<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bottin - Followed Users</title>
</head>
<body>
    <div th:fragment="content" class="container" style="max-width: 480px;">
        <div th:replace="~{fragments/page-header :: headerUnder('Settings', '/settings', 'Followed Users', 'People you follow')}"></div>

        <!-- Populated by settings-lists.js from the relays, not from the render
             cache: this is where a user comes to see what is actually published. -->
        <div class="card" id="follows-list">
            <div class="empty-state">
                <div class="empty-state-icon">👥</div>
                <p>Loading…</p>
            </div>
        </div>
    </div>
</body>
</html>
