<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bottin - Blocked Users</title>
</head>
<body>
    <div th:fragment="content" class="container" style="max-width: 480px;">
        <div th:replace="~{fragments/page-header :: headerUnder('Settings', '/settings', 'Blocked Users', 'People you have blocked')}"></div>

        <!-- Populated by settings-lists.js. Reading this list needs the key, since
             its entries are encrypted, so the page may ask for the passphrase. It is
             the only way to read back what was blocked, which is what keeps a private
             list correctable rather than write-only. -->
        <div class="card" id="blocks-list">
            <div class="empty-state">
                <div class="empty-state-icon">🚫</div>
                <p>Loading…</p>
            </div>
        </div>
    </div>
</body>
</html>
