<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss: https:; font-src 'self' data:;">
    <title th:text="${title} ?: 'Bottin Client'">Bottin Client</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/htmx.js"></script>
    <script src="/js/nostr-tools.js"></script>
    <script src="/js/app.js"></script>
</head>
<body>
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main th:remove="tag">
        <div th:replace="${content}"></div>
    </main>
    <script src="/js/nostr-crypto.js" defer></script>
    <script src="/js/nap-client.js" defer></script>
    <script>
        document.addEventListener('click', function(e) {
            document.querySelectorAll('.nav-dropdown.open').forEach(function(d) {
                if (!d.contains(e.target)) d.classList.remove('open');
            });
        });
    </script>
</body>
</html>
