<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; connect-src 'self' wss: https: ws://localhost:* ws://127.0.0.1:* http://localhost:* http://127.0.0.1:*; font-src 'self' data:;">
    <title th:text="${title} ?: 'Bottin Client'">Bottin Client</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/htmx.js"></script>
    <script src="/js/nostr-tools.js"></script>
    <script src="/js/app.js"></script>
    <!-- Not deferred and not per page: a fragment's inline script runs while
         deferred or fragment-local <script src> tags are still loading, so any
         page binding uploads at parse time bound against an undefined global. -->
    <script src="/js/blossom.js"></script>
    <script src="/js/profile-image.js"></script>
    <script src="/js/profile-fetch.js"></script>
    <script src="/js/nostr-publish.js"></script>
    <script src="/js/replaceable-list.js"></script>
    <script src="/js/list-feedback.js"></script>
    <script src="/js/profile-lookup.js"></script>
    <script src="/js/follow-list.js"></script>
    <script src="/js/block-list.js"></script>
    <script src="/js/settings-lists.js"></script>
    <script src="/js/profile-nudge.js"></script>
</head>
<body>
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <!--/* Not on another key's profile: that page is public and belongs to
           somebody else, so markup addressing the reader about their own profile
           must never be painted onto it, hidden or not. profilePubkey is set only
           by the /profile/{key} route.

           The condition wraps the include rather than sitting beside it:
           th:replace has higher precedence than th:if, so a th:if on the same tag
           is replaced away before it is ever evaluated.

           A parser-level comment, not an HTML one: an HTML comment is rendered
           into the response, where its text would count against assertions about
           what the page says. */-->
    <th:block th:if="${profilePubkey == null}">
        <div th:replace="~{fragments/profile-nudge :: banner}"></div>
    </th:block>
    <main th:remove="tag">
        <div th:replace="${content}"></div>
    </main>
    <div id="unlock-modal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-title">Unlock to Sign</div>
            <p class="text-secondary text-sm mb-2">
                Enter your password to sign and publish. It stays unlocked for this session.
            </p>
            <input type="password" id="unlock-password" class="form-input" placeholder="Password" autocomplete="off">
            <div id="unlock-error" class="form-error hidden mt-1"></div>
            <div class="flex-row-gap-sm mt-2">
                <button class="btn btn-outline" style="flex: 1;" id="unlock-cancel">Cancel</button>
                <button class="btn btn-primary" style="flex: 1;" id="unlock-confirm">Unlock</button>
            </div>
        </div>
    </div>
    <script src="/js/nostr-crypto.js" defer></script>
    <script src="/js/nap-client.js" defer></script>
    <script>
        document.addEventListener('click', function(e) {
            document.querySelectorAll('.nav-dropdown.open').forEach(function(d) {
                if (!d.contains(e.target)) d.classList.remove('open');
            });
        });
    </script>
</body>
</html>
