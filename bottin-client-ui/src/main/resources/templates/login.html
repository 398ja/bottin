<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bottin - Sign In</title>
</head>
<body>
    <div th:fragment="content" class="container" style="max-width: 400px;">
        <div class="card" style="margin-top: 3rem;">
            <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Sign In</h1>
            <p style="color: var(--color-text-secondary); margin-bottom: 1.5rem;">
                Paste your nsec to sign in. Your key stays in your browser.
            </p>

            <div id="login-form">
                <div class="form-group">
                    <label class="form-label">Your nsec (private key)</label>
                    <textarea id="nsec-input" class="form-input" rows="2" placeholder="nsec1..." style="font-family: monospace;"></textarea>
                </div>

                <button id="signin-btn" class="btn btn-primary" style="width: 100%;" onclick="handleLogin()">
                    Sign In
                </button>

                <div id="login-error" class="form-error" style="display: none; margin-top: 0.75rem; text-align: center;"></div>
                <div id="login-loading" style="display: none; text-align: center; margin-top: 1rem; color: var(--color-text-secondary);">
                    Signing challenge...
                </div>
            </div>

            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem;">
                <a href="/restore">Restore from backup</a>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            var nsec = document.getElementById('nsec-input').value.trim();
            var error = document.getElementById('login-error');
            var loading = document.getElementById('login-loading');
            var signinBtn = document.getElementById('signin-btn');

            if (!nsec) {
                error.textContent = 'Please enter your nsec';
                error.style.display = 'block';
                return;
            }

            error.style.display = 'none';
            loading.style.display = 'block';
            signinBtn.disabled = true;

            try {
                var npub = NostrCrypto.nsecToNpub(nsec);
                var hexKey = NostrCrypto.nsecToHex(nsec);

                fetch('/api/v1/auth/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ npub: npub })
                })
                .then(function(r) { return r.json(); })
                .then(function(challenge) {
                    var signedEvent = NostrCrypto.signNip98Event(
                        challenge.challenge,
                        challenge.challenge_id,
                        challenge.auth_url,
                        'POST',
                        hexKey
                    );

                    return fetch('/api/v1/auth/complete', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Nostr ' + signedEvent
                        },
                        body: JSON.stringify({ challenge_id: challenge.challenge_id })
                    });
                })
                .then(function(r) {
                    if (r.ok) {
                        window.location.href = '/search';
                    } else {
                        throw new Error('Authentication failed');
                    }
                })
                .catch(function(err) {
                    error.textContent = err.message;
                    error.style.display = 'block';
                    loading.style.display = 'none';
                    signinBtn.disabled = false;
                });
            } catch (err) {
                error.textContent = 'Invalid nsec format';
                error.style.display = 'block';
                loading.style.display = 'none';
                signinBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
