<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bottin - Sign In</title>
</head>
<body>
    <div th:fragment="content" class="container-narrow">
        <div class="card mt-3">
            <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Sign In</h1>
            <p class="text-secondary text-sm mb-3">
                Paste your nsec to sign in. Your key stays in your browser.
            </p>

            <div id="login-form">
                <div class="form-group">
                    <label class="form-label">Your nsec (private key)</label>
                    <textarea id="nsec-input" class="form-input form-input-mono" rows="2" placeholder="nsec1..." autocomplete="off"></textarea>
                </div>

                <button id="signin-btn" class="btn btn-primary btn-full" onclick="handleLogin()">
                    Sign In
                </button>

                <div id="login-error" class="form-error text-center mt-2 hidden"></div>
                <div id="login-loading" class="hidden text-center mt-2 text-secondary text-sm">
                    Signing challenge...
                </div>
            </div>

            <div class="text-center mt-3 text-sm">
                <a href="/restore">Restore from backup</a>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            var nsec = document.getElementById('nsec-input').value.trim();
            var error = document.getElementById('login-error');
            var loading = document.getElementById('login-loading');
            var signinBtn = document.getElementById('signin-btn');

            if (!nsec) {
                error.textContent = 'Please enter your nsec';
                error.style.display = 'block';
                return;
            }

            error.style.display = 'none';
            loading.style.display = 'block';
            signinBtn.disabled = true;

            try {
                var npub = NostrCrypto.nsecToNpub(nsec);
                var hexKey = NostrCrypto.nsecToHex(nsec);

                fetch('/api/v1/auth/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ npub: npub })
                })
                .then(function(r) { return r.json(); })
                .then(function(challenge) {
                    return NostrCrypto.signNip98Event(
                        challenge.challenge,
                        challenge.challenge_id,
                        challenge.auth_url,
                        'POST',
                        hexKey
                    ).then(function(signedEvent) {
                        return fetch('/api/v1/auth/complete', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Nostr ' + signedEvent
                            },
                            body: JSON.stringify({ challenge_id: challenge.challenge_id })
                        });
                    });
                })
                .then(function(r) {
                    if (r.ok) {
                        window.location.href = '/search';
                    } else {
                        throw new Error('Authentication failed');
                    }
                })
                .catch(function(err) {
                    error.textContent = err.message;
                    error.style.display = 'block';
                    loading.style.display = 'none';
                    signinBtn.disabled = false;
                });
            } catch (err) {
                error.textContent = 'Invalid nsec format';
                error.style.display = 'block';
                loading.style.display = 'none';
                signinBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
