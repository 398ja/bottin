<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bottin - Profile Setup</title>
</head>
<body>
    <div th:fragment="content" class="container-narrow">
        <div class="wizard-step-indicator">
            <div class="wizard-step completed">✓</div>
            <div class="wizard-connector completed"></div>
            <div class="wizard-step active">2</div>
            <div class="wizard-connector"></div>
            <div class="wizard-step">3</div>
            <div class="wizard-connector"></div>
            <div class="wizard-step">4</div>
        </div>

        <div class="card" style="max-width: 480px; margin: 0 auto;">
            <h1 class="page-title" style="margin-bottom: 0.75rem;">Set Up Your Profile</h1>
            <p class="text-secondary text-sm mb-3">
                This information will be visible to others on the Nostr network.
            </p>

            <form hx-post="/onboarding/step-profile" hx-target="body" hx-push-url="false"
                  hx-on::before-request="saveProfileData(event)">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <div style="display: flex; gap: 0.25rem; align-items: stretch;">
                        <span class="form-input" style="flex: 0 0 auto; width: auto; border-right: none; border-radius: var(--radius) 0 0 var(--radius); background: var(--color-bg); display: flex; align-items: center; padding: 0 0.75rem; font-size: 0.875rem; color: var(--color-text-secondary);">@</span>
                        <input type="text" name="username" class="form-input" pattern="[a-z0-9_\-]+" maxlength="64"
                               placeholder="alice" required autocomplete="off"
                               style="border-radius: 0 var(--radius) var(--radius) 0;"
                               hx-get="/api/v1/resolve"
                               hx-trigger="keyup changed delay:500ms"
                               hx-target="#username-hint"
                               hx-swap="innerHTML"
                               hx-params="username">
                    </div>
                    <div class="form-error"></div>
                    <div class="form-hint" id="username-hint">
                        NIP-05: <strong th:text="${bottinDomain} ?: 'alice@bottin.example.com'">alice@bottin.example.com</strong>
                        (auto-registered)
                    </div>
                    <span id="nip05-domain" th:text="${bottinDomain} ?: 'bottin.example.com'" hidden>bottin.example.com</span>
                </div>

                <div class="form-group">
                    <label class="form-label">Display Name</label>
                    <input type="text" name="display_name" class="form-input" maxlength="64" placeholder="Alice">
                </div>

                <div class="form-group">
                    <label class="form-label">Bio</label>
                    <textarea name="about" class="form-input" rows="3" maxlength="300" placeholder="Tell us about yourself"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Avatar</label>
                    <img id="onboarding-preview-picture" class="hidden avatar-lg" alt=""
                         style="display:block;margin-bottom:0.5rem;">
                    <input id="onboarding-picture-file" type="file" accept="image/*" class="form-input">
                    <input type="hidden" name="picture">
                    <div class="form-hint">Uploaded to your media server. Up to 5 MB.</div>
                    <div class="form-error hidden" id="onboarding-error-picture"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Banner</label>
                    <img id="onboarding-preview-banner" class="hidden" alt=""
                         style="width:100%;max-height:120px;object-fit:cover;border-radius:var(--radius);margin-bottom:0.5rem;">
                    <input id="onboarding-banner-file" type="file" accept="image/*" class="form-input">
                    <input type="hidden" name="banner">
                    <div class="form-hint">Shown at the top of your profile. Up to 5 MB.</div>
                    <div class="form-error hidden" id="onboarding-error-banner"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Lightning Address</label>
                    <input type="text" name="lud16" class="form-input" placeholder="alice@getalby.com">
                </div>

                <div class="form-group">
                    <label class="form-label">Website</label>
                    <input type="url" name="website" class="form-input" placeholder="https://example.com">
                </div>

                <div class="flex-row-gap-sm mt-2">
                    <button type="button" class="btn btn-outline" style="flex: 1;"
                            hx-get="/onboarding/step/method" hx-target="body" hx-push-url="false"
                            hx-params="none" hx-on::before-request="saveProfileData()">Back</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;"
                            id="profile-continue-btn">Continue</button>
                </div>
            </form>
        </div>

        <span id="blossom-url" th:text="${blossomUrl}" hidden></span>
    </div>

    <script src="/js/blossom.js"></script>
    <script src="/js/profile-image.js"></script>
    <script>
        // The availability badge is swapped into #username-hint by htmx; Continue
        // follows it, so a handle the directory already holds cannot be carried
        // into key generation only to be rejected at registration. The button is
        // also held while a check is in flight, since the badge on screen then
        // describes the previous handle.
        (function() {
            var continueBtn = document.getElementById('profile-continue-btn');
            var hint = document.getElementById('username-hint');

            document.querySelector('input[name="username"]')
                .addEventListener('htmx:beforeRequest', function() { continueBtn.disabled = true; });

            hint.addEventListener('htmx:afterSwap', function() {
                var badge = hint.querySelector('[data-available]');
                continueBtn.disabled = !!badge && badge.getAttribute('data-available') === 'false';
            });
        })();

        function saveProfileData() {
            var data = JSON.parse(sessionStorage.getItem('onboarding-data') || '{}');
            document.querySelectorAll('[name]').forEach(function(el) {
                if (el.name !== 'method' && el.name !== 'nsec') {
                    data[el.name] = el.value;
                }
            });
            sessionStorage.setItem('onboarding-data', JSON.stringify(data));
        }

        // Uploads must be signed, but on the "generate new key" path no key
        // exists until the confirm step. The key is therefore minted here on
        // first use and stashed as generatedNsec; the confirm step adopts it
        // so the identity is built from that very key.
        function resolveOnboardingSigner() {
            var data = JSON.parse(sessionStorage.getItem('onboarding-data') || '{}');
            var nsec;
            if (data.method === 'import') {
                nsec = (data.nsec || '').trim();
                if (!nsec) {
                    return Promise.reject(new Error('Enter your nsec on the previous step first.'));
                }
            } else {
                nsec = data.generatedNsec;
                if (!nsec) {
                    nsec = NostrTools.nip19.nsecEncode(NostrTools.generateSecretKey());
                    data.generatedNsec = nsec;
                    sessionStorage.setItem('onboarding-data', JSON.stringify(data));
                }
            }
            var hexKey = NostrCrypto.nsecToHex(nsec);
            return Promise.resolve(function(unsigned) {
                return NostrCrypto.signEvent(unsigned, hexKey);
            });
        }

        function storeUploadedUrl(field, url) {
            document.querySelector('[name="' + field + '"]').value = url;
            saveProfileData();
        }

        (function() {
            var data = JSON.parse(sessionStorage.getItem('onboarding-data') || '{}');
            var domainEl = document.getElementById('nip05-domain');
            if (domainEl) {
                data.domain = domainEl.textContent.trim();
                sessionStorage.setItem('onboarding-data', JSON.stringify(data));
            }
            document.querySelectorAll('[name]').forEach(function(el) {
                if (el.name !== 'method' && el.name !== 'nsec' && data[el.name]) {
                    el.value = data[el.name];
                }
            });
            ['picture', 'banner'].forEach(function(field) {
                var img = document.getElementById('onboarding-preview-' + field);
                if (img && data[field]) {
                    img.src = data[field];
                    img.classList.remove('hidden');
                }
            });

            var blossomUrl = ((document.getElementById('blossom-url') || {}).textContent || '').trim();
            ['picture', 'banner'].forEach(function(field) {
                ProfileImage.bind({
                    fileInputId: 'onboarding-' + field + '-file',
                    previewId: 'onboarding-preview-' + field,
                    errorId: 'onboarding-error-' + field,
                    blossomUrl: blossomUrl,
                    resolveSigner: resolveOnboardingSigner,
                    onUploaded: function(url) { storeUploadedUrl(field, url); }
                });
            });
        })();
    </script>
</body>
</html>
