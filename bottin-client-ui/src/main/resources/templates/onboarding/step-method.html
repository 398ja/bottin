<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bottin - Create Account</title>
</head>
<body>
    <div th:fragment="content" class="container-narrow">
        <div class="wizard-step-indicator">
            <div class="wizard-step active">1</div>
            <div class="wizard-connector"></div>
            <div class="wizard-step">2</div>
            <div class="wizard-connector"></div>
            <div class="wizard-step">3</div>
            <div class="wizard-connector"></div>
            <div class="wizard-step">4</div>
        </div>

        <div class="card" style="max-width: 480px; margin: 0 auto;">
            <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Create Your Nostr Identity</h1>
            <p class="text-secondary text-sm mb-3">
                Choose how to set up your Nostr identity. Your private key stays in your browser.
            </p>

            <form onsubmit="return false;">
                <div class="card-radio" onclick="document.getElementById('method-create').checked=true">
                    <label class="flex-row-gap-sm" style="cursor: pointer;">
                        <input type="radio" name="method" id="method-create" value="create" checked style="margin-top: 0.25rem;">
                        <div>
                            <strong>Create New Key</strong>
                            <p class="text-secondary text-xs mt-1">
                                Generate a fresh Nostr keypair. Your nsec will be encrypted and stored locally.
                            </p>
                        </div>
                    </label>
                </div>

                <div class="card-radio mt-2" onclick="document.getElementById('method-import').checked=true">
                    <label class="flex-row-gap-sm" style="cursor: pointer;">
                        <input type="radio" name="method" id="method-import" value="import" style="margin-top: 0.25rem;">
                        <div>
                            <strong>Import Existing Key</strong>
                            <p class="text-secondary text-xs mt-1">
                                Import an existing nsec. It will be used only in your browser and never transmitted.
                            </p>
                        </div>
                    </label>
                </div>

                <div id="import-section" class="hidden mt-2">
                    <div class="form-group">
                        <label class="form-label">Your nsec (private key)</label>
                        <textarea name="nsec" class="form-input form-input-mono" rows="2" placeholder="nsec1..."></textarea>
                    </div>
                </div>

                <div id="method-error" class="form-error hidden mt-2"></div>

                <button type="button" class="btn btn-primary btn-full mt-3" onclick="continueFromMethod()">
                    Continue
                </button>
            </form>
        </div>
    </div>

    <script>
        function onMethodChange(method) {
            document.getElementById('import-section').className = method === 'import' ? 'mt-2' : 'hidden';
            // The import path is two steps; the create path is four.
            var steps = document.querySelectorAll('.wizard-step-indicator .wizard-step');
            var connectors = document.querySelectorAll('.wizard-step-indicator .wizard-connector');
            var hide = method === 'import';
            steps[2].style.display = steps[3].style.display = hide ? 'none' : '';
            connectors[1].style.display = connectors[2].style.display = hide ? 'none' : '';
        }

        document.querySelectorAll('input[name="method"]').forEach(function(r) {
            r.addEventListener('change', function() { onMethodChange(this.value); });
        });

        function continueFromMethod() {
            var method = document.querySelector('input[name="method"]:checked').value;
            var nsec = document.querySelector('[name="nsec"]').value;
            var data = JSON.parse(sessionStorage.getItem('onboarding-data') || '{}');
            data.method = method;
            data.nsec = nsec;
            sessionStorage.setItem('onboarding-data', JSON.stringify(data));

            if (method === 'import') {
                var error = document.getElementById('method-error');
                var trimmed = (nsec || '').trim();
                if (!trimmed) {
                    error.textContent = 'Please enter your nsec.';
                    error.style.display = 'block';
                    return;
                }
                try {
                    if (NostrTools.nip19.decode(trimmed).type !== 'nsec') throw new Error();
                } catch (e) {
                    error.textContent = 'That is not a valid nsec. Please check and try again.';
                    error.style.display = 'block';
                    return;
                }
                error.style.display = 'none';
                htmx.ajax('GET', '/onboarding/step/import', { target: 'body' });
            } else {
                htmx.ajax('GET', '/onboarding/step/profile', { target: 'body' });
            }
        }

        (function() {
            var data = JSON.parse(sessionStorage.getItem('onboarding-data') || '{}');
            if (data.method === 'import') {
                document.getElementById('method-import').checked = true;
            }
            if (data.nsec) {
                document.querySelector('[name="nsec"]').value = data.nsec;
            }
            onMethodChange(document.querySelector('input[name="method"]:checked').value);
        })();
    </script>
</body>
</html>
