<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bottin - Welcome</title>
</head>
<body>
    <div th:fragment="content" class="container-narrow">
        <div class="card text-center">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🎉</div>
            <h1 class="page-title" style="margin-bottom: 0.5rem;">Your Nostr Identity is Ready!</h1>
            <p class="text-secondary text-sm mb-3">
                Your key has been generated and encrypted locally. Save your backup key below.
            </p>

            <div class="callout callout-warning" style="text-align: left;">
                <strong class="text-sm">Your Backup Key (nsec)</strong>
                <p class="text-2xs" style="color: var(--color-warning); margin-bottom: 0.5rem;">
                    This is the only way to recover your identity. Save it somewhere safe.
                </p>
                <div style="position: relative;">
                    <input type="password" id="nsec-display" class="form-input form-input-mono" readonly
                           value="nsec1..." style="font-size: 0.8125rem; padding-right: 2.5rem;">
                    <button type="button" id="reveal-btn" class="btn-ghost" style="position: absolute; right: 0.25rem; top: 0.25rem; font-size: 0.875rem;">👁</button>
                </div>
                <div class="flex-row-gap-sm mt-1">
                    <button class="btn btn-sm btn-outline" id="copy-btn" style="flex: 1;">Copy</button>
                    <button class="btn btn-sm btn-outline" id="download-btn" style="flex: 1;">Download</button>
                </div>
            </div>

            <label class="flex-center gap-sm mt-2 text-sm">
                <input type="checkbox" id="backup-check">
                I have saved my backup key
            </label>

            <a href="/search" class="btn btn-primary btn-full mt-2" id="continue-btn"
               style="pointer-events: none; opacity: 0.5; text-decoration: none; display: inline-block; text-align: center;">
                Continue to Search
            </a>
        </div>
    </div>

    <script>
        (function() {
            var nsec = sessionStorage.getItem('onboarding-nsec');
            var nsecInput = document.getElementById('nsec-display');
            var revealBtn = document.getElementById('reveal-btn');
            var copyBtn = document.getElementById('copy-btn');
            var downloadBtn = document.getElementById('download-btn');
            var backupCheck = document.getElementById('backup-check');
            var continueBtn = document.getElementById('continue-btn');
            var revealed = false;

            if (nsec) {
                nsecInput.value = nsec;

                revealBtn.addEventListener('click', function() {
                    revealed = !revealed;
                    nsecInput.type = revealed ? 'text' : 'password';
                });

                copyBtn.addEventListener('click', function() {
                    navigator.clipboard.writeText(nsec).then(function() {
                        copyBtn.textContent = 'Copied!';
                        setTimeout(function() { copyBtn.textContent = 'Copy'; }, 2000);
                    });
                });

                downloadBtn.addEventListener('click', function() {
                    var blob = new Blob(['Nostr private key (nsec): ' + nsec], { type: 'text/plain' });
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = 'bottin-backup-key.txt';
                    a.click();
                    URL.revokeObjectURL(url);
                });
            }

            backupCheck.addEventListener('change', function() {
                var enabled = this.checked;
                continueBtn.style.pointerEvents = enabled ? 'auto' : 'none';
                continueBtn.style.opacity = enabled ? '1' : '0.5';
            });

            continueBtn.addEventListener('click', function() {
                sessionStorage.removeItem('onboarding-nsec');
            });
        })();
    </script>
</body>
</html>
