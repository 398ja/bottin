<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bottin - Welcome</title>
</head>
<body>
    <div th:fragment="content" class="container" style="max-width: 480px;">
        <div class="card" style="text-align: center;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🎉</div>
            <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Your Nostr Identity is Ready!</h1>
            <p style="color: var(--color-text-secondary); margin-bottom: 1.5rem;">
                Your key has been generated and encrypted locally. Save your backup key below.
            </p>

            <div class="card" style="background: #fef3c7; border: 1px solid #f59e0b; text-align: left;">
                <strong style="font-size: 0.875rem;">Your Backup Key (nsec)</strong>
                <p style="font-size: 0.75rem; color: #92400e; margin-bottom: 0.5rem;">
                    This is the only way to recover your identity. Save it somewhere safe.
                </p>
                <div style="position: relative;">
                    <input type="password" id="nsec-display" class="form-input" readonly
                           value="nsec1..." style="font-family: monospace; font-size: 0.8125rem; padding-right: 2.5rem;">
                    <button type="button" id="reveal-btn" style="position: absolute; right: 0.5rem; top: 0.375rem; background: none; border: none; cursor: pointer; font-size: 0.875rem;">👁</button>
                </div>
                <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                    <button class="btn btn-sm btn-outline" id="copy-btn" style="flex: 1;">Copy</button>
                    <button class="btn btn-sm btn-outline" id="download-btn" style="flex: 1;">Download</button>
                </div>
            </div>

            <label style="display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; font-size: 0.875rem; justify-content: center;">
                <input type="checkbox" id="backup-check">
                I have saved my backup key
            </label>

            <a href="/search" class="btn btn-primary" id="continue-btn" style="width: 100%; margin-top: 1rem; pointer-events: none; opacity: 0.5; text-decoration: none; display: inline-block; text-align: center;">
                Continue to Search
            </a>
        </div>
    </div>

    <script>
        (function() {
            var nsec = sessionStorage.getItem('onboarding-nsec');
            var nsecInput = document.getElementById('nsec-display');
            var revealBtn = document.getElementById('reveal-btn');
            var copyBtn = document.getElementById('copy-btn');
            var downloadBtn = document.getElementById('download-btn');
            var backupCheck = document.getElementById('backup-check');
            var continueBtn = document.getElementById('continue-btn');
            var revealed = false;

            if (nsec) {
                nsecInput.value = nsec;

                revealBtn.addEventListener('click', function() {
                    revealed = !revealed;
                    nsecInput.type = revealed ? 'text' : 'password';
                });

                copyBtn.addEventListener('click', function() {
                    navigator.clipboard.writeText(nsec).then(function() {
                        copyBtn.textContent = 'Copied!';
                        setTimeout(function() { copyBtn.textContent = 'Copy'; }, 2000);
                    });
                });

                downloadBtn.addEventListener('click', function() {
                    var blob = new Blob(['Nostr private key (nsec): ' + nsec], { type: 'text/plain' });
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = 'bottin-backup-key.txt';
                    a.click();
                    URL.revokeObjectURL(url);
                });
            }

            backupCheck.addEventListener('change', function() {
                var enabled = this.checked;
                continueBtn.style.pointerEvents = enabled ? 'auto' : 'none';
                continueBtn.style.opacity = enabled ? '1' : '0.5';
            });
        })();
    </script>
</body>
</html>
