<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bottin - Set Password</title>
</head>
<body>
    <div th:fragment="content" class="container-narrow">
        <div class="wizard-step-indicator">
            <div class="wizard-step completed">✓</div>
            <div class="wizard-connector completed"></div>
            <div class="wizard-step completed">✓</div>
            <div class="wizard-connector completed"></div>
            <div class="wizard-step active">3</div>
            <div class="wizard-connector"></div>
            <div class="wizard-step">4</div>
        </div>

        <div class="card" style="max-width: 480px; margin: 0 auto;">
            <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Set Encryption Password</h1>
            <p class="text-secondary text-sm mb-3">
                Your private key will be encrypted with this password and stored in your browser.
            </p>

            <form hx-post="/onboarding/step-security" hx-target="body" hx-push-url="false"
                  hx-on::before-request="saveSecurityData(event)">
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" id="password" class="form-input" minlength="8" required autocomplete="new-password">
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strength-bar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm" id="confirm" class="form-input" minlength="8" required autocomplete="new-password">
                </div>

                <div id="mismatch" class="form-error hidden mb-2">Passwords do not match</div>

                <button type="submit" class="btn btn-primary btn-full mt-2">
                    Continue
                </button>
            </form>
        </div>
    </div>

    <script>
        function saveSecurityData(event) {
            var password = document.getElementById('password').value;
            var confirm = document.getElementById('confirm').value;
            var mismatch = document.getElementById('mismatch');

            if (password !== confirm) {
                mismatch.style.display = 'block';
                if (event) event.preventDefault();
                return;
            }

            mismatch.style.display = 'none';
            var data = JSON.parse(sessionStorage.getItem('onboarding-data') || '{}');
            data.password = password;
            sessionStorage.setItem('onboarding-data', JSON.stringify(data));
        }

        document.getElementById('password').addEventListener('input', function() {
            var score = 0;
            if (this.value.length >= 8) score++;
            if (this.value.length >= 12) score++;
            if (/[a-z]/.test(this.value) && /[A-Z]/.test(this.value)) score++;
            if (/\d/.test(this.value)) score++;
            if (/[^a-zA-Z0-9]/.test(this.value)) score++;
            var labels = ['', 'weak', 'fair', 'good', 'strong', 'strong'];
            document.getElementById('strength-bar').className = 'password-strength-bar ' + labels[score];
        });
    </script>
</body>
</html>
