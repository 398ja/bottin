# NAP's rate limiter and its outstanding-challenge caps key on the caller's
# address, so what the container believes that address to be decides whether
# they bound one caller or every caller at once. This interface is public, so
# collapsing every visitor onto one address would cap the whole deployment at
# 30 sign-in attempts a minute.
#
# Tomcat's RemoteIpValve applies X-Forwarded-For, but only when the immediate
# peer matches internal-proxies. That list is empty here, so by default nothing
# is trusted to state the caller's address and a direct caller cannot mint a
# fresh identity per request to walk past the limiter.
#
# Tomcat's own default trusts every private range, which is not safe for this
# deployment: with the port published from Docker the peer is the bridge
# gateway, a private address, so any caller reaching the port would be trusted.
#
# Behind a real proxy, set BOTTIN_TRUSTED_PROXIES to a regex matching it (e.g.
# "10\.0\.0\.5" or "172\.18\.\d{1,3}\.\d{1,3}").
server:
  port: ${BOTTIN_CLIENT_PORT:8081}
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${BOTTIN_TRUSTED_PROXIES:}

spring:
  application:
    name: bottin-client-ui
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: ${THYMELEAF_CACHE:false}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

nap:
  enabled: true
  external-base-url: ${BOTTIN_EXTERNAL_URL:http://localhost:8080}
  challenge-ttl-seconds: 60
  session-ttl-seconds: 3600
  max-clock-skew-seconds: 60
  protected-path-prefixes: /api/v1/follow,/api/v1/block,/api/v1/relays,/api/v1/publish-contact-list,/api/v1/register
  cookie:
    name: client_session
    http-only: true
    secure: ${COOKIE_SECURE:true}
    same-site: Lax
    path: /
    max-age-seconds: 3600

bottin:
  client:
    domain: bottin.example.com
    # The media server and relay sets are not configured here. They are
    # operational data an administrator maintains at /admin/settings and this
    # server reads through the directory API.
    # The bottin directory API this server registers onboarded handles with. Its
    # /api/v1/records endpoint requires Basic auth, so the credentials stay here
    # rather than in the browser.
    directory-url: ${BOTTIN_DIRECTORY_URL:http://localhost:8080}
    directory-username: ${BOTTIN_API_USER:api}
    directory-password: ${BOTTIN_API_PASSWORD:changeme-api}
