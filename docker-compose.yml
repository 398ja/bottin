services:
  bottin-api:
    image: docker.398ja.xyz/bottin-api:latest
    # To build locally instead, uncomment:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.api
    container_name: bottin-api
    ports:
      - "${BOTTIN_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - BOTTIN_DATABASE_URL=jdbc:postgresql://postgres:5432/bottin
      - BOTTIN_DATABASE_USER=bottin
      - BOTTIN_DATABASE_PASSWORD=${BOTTIN_DATABASE_PASSWORD:-bottin}
      - BOTTIN_ADMIN_USER=${BOTTIN_ADMIN_USER:-admin}
      - BOTTIN_ADMIN_PASSWORD=${BOTTIN_ADMIN_PASSWORD:-changeme}
      # Credential for machine callers such as bottin-client. Separate from the
      # admin one so a service holding it cannot act as the admin.
      - BOTTIN_API_PASSWORD=${BOTTIN_API_PASSWORD:-changeme-api}
      - BOTTIN_DEFAULT_DOMAIN=${BOTTIN_DEFAULT_DOMAIN:-${BOTTIN_DOMAIN:-}}
      # Regex matching the proxy allowed to set X-Forwarded-For. Empty means no
      # peer is trusted, so the rate limiter keys on the actual connection.
      - BOTTIN_TRUSTED_PROXIES=${BOTTIN_TRUSTED_PROXIES:-}
      - BOTTIN_API_DOCS_ENABLED=${BOTTIN_API_DOCS_ENABLED:-false}
      - BOTTIN_SWAGGER_ENABLED=${BOTTIN_SWAGGER_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - bottin-network

  bottin-admin:
    image: docker.398ja.xyz/bottin-admin-ui:latest
    # To build locally instead, uncomment:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.admin
    container_name: bottin-admin
    ports:
      - "${BOTTIN_ADMIN_PORT:-8081}:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - BOTTIN_DATABASE_URL=jdbc:postgresql://postgres:5432/bottin
      - BOTTIN_DATABASE_USER=bottin
      - BOTTIN_DATABASE_PASSWORD=${BOTTIN_DATABASE_PASSWORD:-bottin}
      # Administrators sign in by proving control of a Nostr key. This is the
      # public key the deployment accepts — not a secret, which is what makes it
      # safe here where a password was not. There is no default: an unconfigured
      # deployment admits nobody rather than somebody known.
      - BOTTIN_ADMIN_NPUB=${BOTTIN_ADMIN_NPUB:-}
      # Must match the URL the browser uses, or the signed proof names a
      # different address than it is sent to and is rejected.
      - BOTTIN_ADMIN_EXTERNAL_URL=${BOTTIN_ADMIN_EXTERNAL_URL:-http://localhost:${BOTTIN_ADMIN_PORT:-8081}}
      - BOTTIN_DEFAULT_DOMAIN=${BOTTIN_DEFAULT_DOMAIN:-${BOTTIN_DOMAIN:-}}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - bottin-network

  bottin-client:
    build:
      context: ./bottin-client-ui
      dockerfile: ../Dockerfile.client
    container_name: bottin-client
    ports:
      - "${BOTTIN_CLIENT_PORT:-8082}:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NAP_ENABLED=true
      - BOTTIN_CLIENT_DOMAIN=${BOTTIN_CLIENT_DOMAIN:-${BOTTIN_DOMAIN:-bottin.example.com}}
      # Directory API used to register onboarded handles. Reached over the compose
      # network as the api user, whose credential must match the one bottin-api is
      # started with. Not the admin credential: this container only needs to write
      # NIP-05 records.
      - BOTTIN_DIRECTORY_URL=${BOTTIN_DIRECTORY_URL:-http://bottin-api:8080}
      - BOTTIN_API_USER=${BOTTIN_API_USER:-api}
      - BOTTIN_API_PASSWORD=${BOTTIN_API_PASSWORD:-changeme-api}
      # The media server and the relay sets are not configured here. They are
      # operational data an administrator maintains at /admin/settings, which the
      # client reads through the directory API. A fresh stack comes up with them
      # unset by design; see docs/how-to/configure-deployment-settings.md.
    restart: unless-stopped
    healthcheck:
      # This module has no actuator dependency, so /actuator/health 404s and the
      # container never leaves "unhealthy". /login is a rendered page, so a 200
      # also proves Thymeleaf and the servlet stack are up.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - bottin-network

  relay:
    # strfry over nostr-rs-relay: the latter's 0.10.0 image panics on startup
    # (quanta "po2_denom was zero!") and then silently drops every EVENT.
    # The image's own config binds loopback-only, so strfry.conf is mounted over it.
    image: ghcr.io/hoytech/strfry:latest
    container_name: bottin-relay
    ports:
      - "${BOTTIN_RELAY_PORT:-8086}:7777"
    volumes:
      - ./relay/strfry.conf:/app/strfry.conf:ro
      - bottin-relay-data:/app/strfry-db
    restart: unless-stopped
    networks:
      - bottin-network

  blossom:
    image: ghcr.io/hzrd149/blossom-server:master
    container_name: bottin-blossom
    ports:
      - "${BOTTIN_BLOSSOM_PORT:-8888}:3000"
    volumes:
      - bottin-blossom-data:/app/data
    restart: unless-stopped
    networks:
      - bottin-network

  postgres:
    image: postgres:16-alpine
    container_name: bottin-postgres
    environment:
      - POSTGRES_DB=bottin
      - POSTGRES_USER=bottin
      - POSTGRES_PASSWORD=${BOTTIN_DATABASE_PASSWORD:-bottin}
    volumes:
      - bottin-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bottin -d bottin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bottin-network

volumes:
  bottin-postgres-data:
  bottin-relay-data:
  bottin-blossom-data:

networks:
  bottin-network:
    driver: bridge
