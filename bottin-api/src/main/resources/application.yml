spring:
  application:
    name: bottin

  # Database - use H2 by default for development
  datasource:
    url: jdbc:h2:mem:bottin;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

  # H2 Console (development only)
  h2:
    console:
      enabled: true
      path: /h2-console

# Bottin Configuration
bottin:
  default-domain: ""

  # Admin credentials
  admin:
    username: admin
    # password: Set via BOTTIN_ADMIN_PASSWORD environment variable

  # Credential for machine callers (the client UI, scripts): API access, no admin
  # rights. Kept separate from the admin password so issuing it to a service does
  # not issue the admin credential.
  # api.password: Set via BOTTIN_API_PASSWORD environment variable

  # API documentation
  api:
    title: Bottin NIP-05 Registry API
    description: REST API for managing NIP-05 identity records and domains
    version: 1.0.0

  # Profile reach (follower count) calculation
  reach:
    enabled: true
    calculation-cron: "0 0 */6 * * ?"   # every 6 hours
    relay-timeout-seconds: 12
    max-followers-per-relay: 5000
    max-profiles-per-run: 10000
    default-relays:
      - wss://relay.damus.io
      - wss://nos.lol
      - wss://relay.nostr.band         # indexing relay for coverage

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha

# Logging
logging:
  level:
    xyz.tcheeric.bottin: DEBUG
    org.springframework.security: INFO
